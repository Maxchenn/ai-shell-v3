<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Shell</title>
  </head>

  <body>
    <div id="app">
      <main id="mainView" class="main-view">
        <header class="topbar">
          <div class="site-picker" aria-label="切换 AI 网站">
            <div class="site-current-icon-wrap" title="切换 AI 网站">
              <img
                id="siteIcon"
                class="site-current-icon"
                alt=""
                draggable="false"
              />
              <span id="siteIconFallback" class="site-icon-fallback">AI</span>
            </div>
            <select
              id="siteSelect"
              class="site-select-overlay"
              aria-label="切换 AI 网站"
            ></select>
          </div>

          <div
            id="dragZone"
            class="drag-zone"
            aria-hidden="true"
          ></div>

          <div class="window-actions">
            <button
              class="icon-button"
              id="pinButton"
              title="置顶"
              aria-label="置顶"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 3l7 7-2.1 2.1-2-2-3.6 3.6 3 3-1.6 1.6-3-3L8 20l-2-2 4.7-4.7-3-3L9 8.7l3 3 3.6-3.6-2-2L14 3z"/>
              </svg>
            </button>

            <button
              class="icon-button"
              id="settingsButton"
              title="设置"
              aria-label="设置"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.8 7.8 0 0 0 0 2l-2.2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2.4-1.6zM13 15.6A3.6 3.6 0 1 1 13 8a3.6 3.6 0 0 1 0 7.6z"/>
              </svg>
            </button>

            <button
              class="icon-button"
              id="minimizeButton"
              title="最小化"
              aria-label="最小化"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 11h14v2H5z"/>
              </svg>
            </button>

            <button
              class="icon-button close-button"
              id="closeButton"
              title="隐藏到系统托盘"
              aria-label="隐藏到系统托盘"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/>
              </svg>
            </button>
          </div>
        </header>

        <section
          id="settingsPanel"
          class="settings"
          aria-hidden="true"
        >
          <div class="settings-content">
            <section class="settings-section">
              <div class="section-heading">
                <div>
                  <div class="section-title">AI 网站</div>
                  <div class="section-subtitle">管理左上角可切换的网站</div>
                </div>
              </div>

              <div id="siteList" class="site-list"></div>

              <div class="add-site-card">
                <div class="subsection-title">添加 AI 网站</div>
                <div class="add-site-row">
                  <input
                    id="newSiteName"
                    type="text"
                    maxlength="40"
                    placeholder="网站名称"
                  />
                  <input
                    id="newSiteUrl"
                    type="text"
                    placeholder="https://example.com"
                  />
                  <button
                    id="addSiteButton"
                    class="small-button primary-button"
                    type="button"
                  >
                    添加
                  </button>
                </div>
              </div>
            </section>

            <section class="settings-section">
              <div class="section-heading">
                <div>
                  <div class="section-title">快捷键</div>
                  <div class="section-subtitle">点击输入框后直接按组合键</div>
                </div>
              </div>

              <div class="setting-row shortcut-row">
                <div>
                  <div class="setting-label">呼出 / 隐藏 AI Shell</div>
                  <div class="setting-hint">例如 Ctrl + Alt + Space</div>
                </div>
                <input
                  id="shortcutInput"
                  class="shortcut-input"
                  type="text"
                  readonly
                  value=""
                  aria-label="全局快捷键"
                  title="点击后按下快捷键"
                />
              </div>
            </section>

            <section class="settings-section">
              <div class="section-heading">
                <div>
                  <div class="section-title">启动</div>
                  <div class="section-subtitle">应用启动时自动在后台运行</div>
                </div>
              </div>

              <div class="setting-row">
                <div>
                  <div class="setting-label">开机启动</div>
                  <div class="setting-hint">启动后不主动弹出窗口。</div>
                </div>
                <input
                  id="autostartToggle"
                  class="switch"
                  type="checkbox"
                />
              </div>
            </section>

            <div id="settingsMessage" class="settings-message" role="status"></div>
          </div>
        </section>
      </main>

      <div id="downloadToast" class="download-toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
